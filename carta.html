<!doctype html>
<html lang="val">
    <head>
        <!-- Banner de consentimiento + Google Analytics (carga condicional) -->
        <script src="js/consent.js" defer></script>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Carta | Cal Marengo Gastrobar</title>
        <meta
            name="description"
            content="Carta de Cal Marengo Gastrobar a Vinalesa. Entrepans 2.0, esmorzars i plats de cuina valenciana tradicional."
        />
        <meta name="robots" content="index, follow" />

        <!-- Canonical y Hreflang -->
        <link rel="canonical" href="https://calmarengo.com/carta" />
        <link
            rel="alternate"
            hreflang="val"
            href="https://calmarengo.com/carta"
        />
        <link
            rel="alternate"
            hreflang="es"
            href="https://calmarengo.com/es/carta"
        />
        <link
            rel="alternate"
            hreflang="x-default"
            href="https://calmarengo.com/carta"
        />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
        <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#1a1a1a" />
        <meta name="color-scheme" content="light" />

        <!-- Fonts (async, non-blocking) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap"
                rel="stylesheet"
            />
        </noscript>

        <!-- Critical CSS inline (sync con css/styles.css) -->
        <style>
            :root{--color-gold:#c9a962;--color-gold-light:#d4bc7c;--color-gold-dark:#a68b4b;--color-black:#1a1a1a;--color-black-soft:#2d2d2d;--color-cream:#f5f1e8;--color-cream-dark:#e8e2d5;--color-wine:#722f37;--font-display:"Cormorant Garamond",Georgia,serif;--font-body:"Montserrat",system-ui,sans-serif;--spacing-xs:0.5rem;--spacing-sm:1rem;--spacing-md:2rem;--spacing-lg:4rem;--spacing-xl:6rem}
            *{margin:0;padding:0;box-sizing:border-box}
            html{scroll-behavior:smooth}
            body{font-family:var(--font-body);background-color:var(--color-cream);color:var(--color-black);line-height:1.6}
            #cm-consent{position:fixed;bottom:0;left:0;right:0;z-index:9999;background-color:var(--color-black);color:var(--color-cream);padding:var(--spacing-md);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--spacing-sm);box-shadow:0 -2px 12px rgba(0,0,0,.3)}
            #cm-consent p{margin:0;flex:1 1 280px;font-size:.9rem;line-height:1.4}
            .cm-consent-actions{display:flex;gap:.5rem}
            #cm-consent button{cursor:pointer;border:1px solid var(--color-gold);padding:.5rem 1rem;font-weight:600;border-radius:4px;background-color:transparent;color:var(--color-cream);font-size:.85rem;font-family:inherit}
            #cm-consent .cm-consent-accept{background-color:var(--color-gold);color:var(--color-black)}
            @media (max-width:600px){#cm-consent{flex-direction:column;align-items:stretch;text-align:center}.cm-consent-actions{justify-content:center}}
        </style>

        <!-- Full CSS (async, non-blocking) -->
        <link
            rel="preload"
            as="style"
            href="css/styles.css"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link rel="stylesheet" href="css/styles.css" />
        </noscript>

        <style>
            body {
                padding-top: 0;
            }

            .carta-page-header {
                background-color: var(--color-black);
                padding: var(--spacing-sm) var(--spacing-md);
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .carta-page-header .logo {
                font-family: var(--font-display);
                font-size: 1.4rem;
                font-weight: 400;
                color: var(--color-gold);
                text-decoration: none;
                font-style: italic;
            }

            .carta-page-header .logo span {
                display: block;
                font-family: var(--font-body);
                font-size: 0.6rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--color-cream);
                opacity: 0.7;
                margin-top: 0.15rem;
            }

            .carta-lang-switch {
                display: flex;
                gap: 0.5rem;
            }

            .carta-lang-switch a {
                color: var(--color-cream);
                opacity: 0.5;
                text-decoration: none;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 0.4rem 0.6rem;
                border: 1px solid transparent;
                border-radius: 4px;
                transition: all 0.3s ease;
            }

            .carta-lang-switch a.active {
                opacity: 1;
                color: var(--color-gold);
                border-color: var(--color-gold);
            }

            .carta-lang-switch a:hover:not(.active) {
                opacity: 0.8;
            }

            #carta-content {
                padding: var(--spacing-md);
                padding-bottom: var(--spacing-lg);
                background-color: var(--color-cream-dark);
            }

            #carta-content .section-title {
                font-size: 2rem;
                margin-bottom: var(--spacing-md);
            }

            .carta-footer {
                background-color: var(--color-black);
                color: var(--color-cream);
                padding: var(--spacing-md);
                text-align: center;
            }

            .carta-footer p {
                font-size: 0.9rem;
                margin-bottom: var(--spacing-xs);
            }

            .carta-footer a {
                color: var(--color-gold);
                text-decoration: none;
                font-weight: 500;
            }

            .carta-footer .btn {
                margin-top: var(--spacing-sm);
            }

            .back-link {
                display: inline-block;
                color: var(--color-cream);
                font-size: 0.8rem;
                text-decoration: none;
                opacity: 0.7;
                margin-top: var(--spacing-sm);
            }

            .back-link:hover {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <!-- Header con selector de idioma -->
        <header class="carta-page-header">
            <a href="index.html" class="logo">
                Cal Marengo
                <span>Gastrobar</span>
            </a>
            <div class="carta-lang-switch">
                <a href="carta.html" class="active">VAL</a>
                <a href="es/carta.html">ES</a>
            </div>
        </header>

        <!-- Carta -->
        <section id="carta-content" class="carta"></section>

        <!-- Footer -->
        <footer class="carta-footer">
            <p><strong>Cal Marengo Gastrobar</strong></p>
            <p>C/ Cura Sapinya, 32 · Vinalesa</p>
            <p><a href="tel:681035690">681 035 690</a></p>
            <a href="tel:681035690" class="btn btn-primary">Reservar Taula</a>
            <br />
            <a href="index.html" class="back-link">← Tornar a la web</a>
            <p
                class="credits"
                style="margin-top: 1rem; font-size: 0.75rem; color: rgba(245, 241, 232, 0.6)"
            >
                Disseny web per
                <a
                    href="https://guillermobadia.com/es/index.html"
                    target="_blank"
                    rel="noopener"
                    style="color: var(--color-gold)"
                    >Guillermo Badia</a
                >
            </p>
        </footer>

        <!-- Datos de la carta -->
        <script src="js/carta-data.js" defer></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => mountCarta("val"));
        </script>
    </body>
</html>
